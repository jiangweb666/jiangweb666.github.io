<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>我们在一起计时</title>
    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(circle at 15% 20%, rgba(251, 207, 232, 0.65), transparent 45%),
                radial-gradient(circle at 80% 10%, rgba(196, 181, 253, 0.6), transparent 42%),
                radial-gradient(circle at 85% 85%, rgba(252, 211, 77, 0.22), transparent 35%),
                linear-gradient(135deg, #fde7f3 0%, #e9ddff 45%, #dbeafe 100%);
            overflow: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 9999px;
            filter: blur(10px);
            z-index: 0;
            animation: float 9s ease-in-out infinite;
        }

        body::before {
            width: 260px;
            height: 260px;
            background: rgba(255, 255, 255, 0.35);
            top: -90px;
            right: -70px;
        }

        body::after {
            width: 200px;
            height: 200px;
            background: rgba(244, 114, 182, 0.18);
            bottom: -65px;
            left: -50px;
            animation-delay: 2s;
        }

        .timer-card {
            position: relative;
            z-index: 1;
            width: min(920px, 100%);
            border-radius: 1.5rem;
            padding: clamp(1.4rem, 3vw, 2.3rem);
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 22px 50px rgba(124, 58, 237, 0.15);
            backdrop-filter: blur(12px);
        }

        .timer-grid {
            margin-top: 1.3rem;
            display: grid;
            gap: 0.8rem;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .time-cell {
            background: rgba(255, 255, 255, 0.78);
            border: 1px solid rgba(236, 72, 153, 0.14);
            border-radius: 1rem;
            padding: 1rem 0.8rem;
            box-shadow: 0 10px 22px rgba(15, 23, 42, 0.05);
        }

        .time-value {
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            line-height: 1;
            font-weight: 800;
            color: #1f2937;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.03em;
        }

        .time-label {
            margin-top: 0.45rem;
            font-size: 0.9rem;
            color: #6b7280;
        }

        .full-timer {
            margin-top: 1.1rem;
            color: #4b5563;
            font-size: 0.95rem;
            font-variant-numeric: tabular-nums;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @media (min-width: 768px) {
            .timer-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }
    </style>
</head>

<body>
    <main class="timer-card text-center">
        <p class="text-pink-500 tracking-[0.2em] text-xs md:text-sm font-semibold">LOVE TIMER</p>
        <h1 class="mt-3 text-3xl md:text-4xl font-extrabold text-slate-800">我们在一起已经</h1>

        <section class="timer-grid" aria-label="计时器">
            <article class="time-cell">
                <p id="days" class="time-value">0</p>
                <p class="time-label">天</p>
            </article>
            <article class="time-cell">
                <p id="hours" class="time-value">0</p>
                <p class="time-label">小时</p>
            </article>
            <article class="time-cell">
                <p id="minutes" class="time-value">0</p>
                <p class="time-label">分钟</p>
            </article>
            <article class="time-cell">
                <p id="seconds" class="time-value">0</p>
                <p class="time-label">秒</p>
            </article>
        </section>

        <p id="countup-timer" class="full-timer">0天 0小时 0分钟 0秒</p>
        <p class="mt-2 text-sm text-slate-500">从 2025 年 4 月 26 日开始</p>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const dayEl = document.getElementById('days');
            const hourEl = document.getElementById('hours');
            const minuteEl = document.getElementById('minutes');
            const secondEl = document.getElementById('seconds');
            const fullTimerEl = document.getElementById('countup-timer');
            const startDate = new Date('2025-04-26T00:00:00+08:00');

            function updateCountupTimer() {
                const now = new Date();
                const diffMs = now - startDate;

                if (diffMs < 0) {
                    dayEl.textContent = '0';
                    hourEl.textContent = '0';
                    minuteEl.textContent = '0';
                    secondEl.textContent = '0';
                    fullTimerEl.textContent = '0天 0小时 0分钟 0秒';
                    return;
                }

                const totalSeconds = Math.floor(diffMs / 1000);
                const days = Math.floor(totalSeconds / 86400);
                const hours = Math.floor((totalSeconds % 86400) / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);
                const seconds = totalSeconds % 60;

                dayEl.textContent = String(days);
                hourEl.textContent = String(hours).padStart(2, '0');
                minuteEl.textContent = String(minutes).padStart(2, '0');
                secondEl.textContent = String(seconds).padStart(2, '0');
                fullTimerEl.textContent = `${days}天 ${hours}小时 ${minutes}分钟 ${seconds}秒`;
            }

            updateCountupTimer();
            setInterval(updateCountupTimer, 1000);
        });
    </script>
</body>

</html>
